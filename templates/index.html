<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Dragon</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Overlay for initial load -->
    <div class="overlay">
        <button class="play-button" onclick="enterSite()">🔥 Enter the Underworld 🔥</button>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Red Dragon</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#empire">Empire</a></li>
            <li><a href="#legacy">Legacy</a></li>
        </ul>
    </nav>

    <!-- Fire animations on both sides -->
    <div class="fire-left"></div>
    <div class="fire-right"></div>

    <!-- Particle canvas for smoke effect -->
    <canvas id="particle-canvas"></canvas>

    <!-- Audio Player (hidden) -->
    <audio id="gangsta-audio" loop>
        <source src="{{ url_for('static', filename='mass.mp3') }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Main content -->
    <main class="container">
        <section class="hero" id="home">
            <h1 class="neon-text">Red Dragon</h1>
            <p class="description" id="description">The unrivaled king of the underworld, forged in flames</p>
            <img src="{{ url_for('static', filename='713321AD112.JPG') }}" alt="Red Dragon" class="hero-image">
        </section>
        <!-- Placeholder sections for navigation -->
        <section id="empire" class="section">
            <h2>The Empire</h2>
            <p>Built on power, loyalty, and unrelenting ambition.</p>
        </section>
        <section id="legacy" class="section">
            <h2>The Legacy</h2>
            <p>A name etched in fire, feared for generations.</p>
        </section>
    </main>

    <!-- Marquee with glitch effect -->
    <div class="marquee">
        <span>Red Dragon Reigns Supreme – Bow to the Flame!</span>
    </div>

    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
<script>
    function enterSite() {
        const overlay = document.querySelector('.overlay');
        const audio = document.getElementById('gangsta-audio');
        overlay.classList.add('hidden');
        audio.play();
    
        // Typewriter effect for description
        const description = document.getElementById('description');
        const text = description.textContent;
        description.textContent = '';
        description.classList.add('visible');
        let i = 0;
    
        function typeWriter() {
            if (i < text.length) {
                description.textContent += text.charAt(i);
                i++;
                setTimeout(typeWriter, 60);
            }
        }
    
        setTimeout(typeWriter, 600);
    }
    
    // Custom Cursor Movement
    document.addEventListener('mousemove', (e) => {
        const cursor = document.querySelector('.custom-cursor');
        cursor.style.left = `${e.clientX}px`;
        cursor.style.top = `${e.clientY}px`;
    });
    
    // Particle Effect for Smoke
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const particles = [];
    const particleCount = 100;
    
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 5 + 1;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 -0.25;
        }
    
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
    
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
    
        draw() {
            ctx.fillStyle = 'rgba(255, 102, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    function initParticles() {
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
    }
    
    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(particle => {
            particle.update();
            particle.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    
    initParticles();
    animateParticles();
    
    // Resize Canvas on Window Resize
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
    
    // Smooth Scroll for Navigation
    document.querySelectorAll('.nav-links a').forEach(anchor => {
        anchor.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = anchor.getAttribute('href').substring(1);
            const targetElement = document.getElementById(targetId);
            targetElement.scrollIntoView({ behavior: 'smooth' });
        });
    });
</script>
